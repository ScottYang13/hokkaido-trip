<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北海道札幌 7 天 6 夜極致行程</title>
</head>
<body style="margin:0; padding:0; background-color: #f1f5f9;">

    <div id="app">行程資料載入中...</div>

    <script>
        const gasApiUrl = 'https://script.google.com/macros/s/AKfycbzFRtKvX3EiI2R9UdK7EFQQDLC63r6u6IzvSy5OtwpiedbvEFAn11nOkE2dqpVD9rutoA/exec';

        // 防快取時間戳記
        fetch(gasApiUrl + '?t=' + Date.now())
            .then(res => {
                if (!res.ok) throw new Error('HTTP 錯誤：' + res.status);
                return res.text();
            })
            .then(htmlContent => {
                const app = document.getElementById('app');
                app.innerHTML = htmlContent;

                // 重新實體化並執行注入內容中的 <script> 標籤 (確保計時器與按鈕等互動生效)
                const scripts = app.querySelectorAll("script");
                scripts.forEach(oldScript => {
                    const newScript = document.createElement("script");
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            })
            .catch(err => {
                document.getElementById('app').innerHTML = '<p style="padding:20px; color:red;">載入失敗：' + err.message + '</p>';
            });
    </script>

</body>
</html>
